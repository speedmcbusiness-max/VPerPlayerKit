# VPerPlayerKit configuration
# Menu names, materials and lore live in menus.yml. All text supports MiniMessage.

# Number of personal kit slots (1-14). 7 matches the classic Kit Menu layout; slots are set in menus.yml
max-kits: 7

storage:
  # sqlite = single server, mysql = shared between servers (cross-server kits)
  type: sqlite
  sqlite-file: kits.db
  mysql:
    host: localhost
    port: 3306
    database: vperplayerkit
    username: root
    password: ""
    use-ssl: false

load-kit:
  clear-inventory: true
  heal: true
  sync-enderchest: true      # copy the kit's saved enderchest into the vanilla enderchest
  sound: entity.experience_orb.pickup   # namespaced sound key, empty string disables

notifications:
  broadcast-kit-load: false      # tell everyone when someone loads a personal kit
  broadcast-public-kit: false    # tell everyone when someone loads a public kit
  # players with perplayerkit.notifications.bypass never trigger these broadcasts

share:
  code-length: 6

rtpq:
  world: world                  # the world the RTP queue, FFA and Gladiator fight in (set this to YOUR world's name)
  # Optional: a dedicated world for a biome, e.g.  plains: my_plains_world . Leave empty to find the biome inside rtpq.world.
  worlds: {}
  rtp-radius: 5000            # random teleport range around 0,0 in those worlds
  arena-size: 250             # danger zone is a square of this many blocks
  min-arena-distance: 400     # arenas (and new RTPs) stay at least this far from other duels
  spawn-distance: 25          # each player starts this many blocks from the arena center
  countdown-seconds: 3
  winner-auto-requeue: true   # winner goes straight back into the queue (same kit and biome) for a new arena
  match-target: 2             # first to 2 kills
  test-target: 3              # first to 3 kills for tier tests
  auto-totem: true            # a lethal hit moves a totem from the inventory into the offhand so it pops automatically
  zone:                       # the danger zone starts at arena-size and shrinks/moves like a battle royale ring
    shapes: [square, circle]  # picked at random per match, use [circle] or [square] to force one
    min-radius: 40            # it stops shrinking at this radius
    shrink-start-seconds: 60  # time before the first shrink
    shrink-duration-seconds: 25
    hold-seconds: 20          # pause between shrinks
    shrink-factor: 0.7        # each shrink keeps this share of the radius
    beacons: true             # red beam columns on the edge (they move with the zone)
    beam-count: 16
    beam-block: RED_STAINED_GLASS
  danger-zone:
    grace-seconds: 3          # warning time before damage starts
    damage: 10.0              # health points per second outside (10 = 5 hearts)

rtp:
  # /rtp <biome> finds that biome in rtpq.world (or the biome's own world from rtpq.worlds). /qrtp teleports inside the world you are in
  # (only those worlds, nether/end/lobby are rejected unless quick-any-world is true).
  biomes:                       # the biome choices (/rtp, the RTP queue, FFA, Gladiator). Values are Minecraft biome names.
    plains: [plains, sunflower_plains, meadow]
    desert: [desert]
    badlands: [badlands, eroded_badlands, wooded_badlands]
    snow: [snowy_plains, snowy_taiga, ice_spikes, snowy_slopes]
    mushroom: [mushroom_fields]
  biome-search-radius: 3000     # how far around a random point a biome is searched (mushroom islands are rare, raise it)
  radius: 5000                 # random range around the world border center
  min-distance: 500            # /qrtp lands at least this far from where you stood
  cooldown-seconds: 5          # perplayerkit.rtp.bypass skips it
  attempts: 40
  quick-any-world: false

announce:
  win-actionbar: true           # "<player> Won" above the hotbar after a duel / FFA / Gladiator
  win-broadcast-duel: true      # chat broadcast of a duel win
  win-broadcast-gladiator: true # chat broadcast of a Gladiator win
  high-tier:
    enabled: true               # announce when a high tier player joins a duel, FFA or Gladiator
    min-tier: LT2               # LT2, HT2, LT1 and HT1 are announced
    max-names: 5                # opponents listed before "and N more"

spectator:
  enabled: true
  allow-duel: true
  allow-ffa: true
  allow-gladiator: true
  max-distance: 200             # spectators are pulled back when they fly further than this from their target
  block-commands: true          # spectators can only use the commands below
  allowed-commands: [spec, spectator, leave]
  notify-target: false          # tell the watched player when someone starts spectating

event:
  min-players: 2                # /event start needs this many players in the lobby
  max-players: 50

ffa:
  mode: rtp                     # rtp = random arena in the RTP worlds like duels, arenas = the spawn-block arenas from /ffartp
  biome: auto                   # rtp mode: which RTP world (auto or a key from rtp.biomes)
  spawn-radius: 60              # rtp mode: players are spread on a ring this far from the center
  zone:                         # rtp mode: same danger zone as duels, but bigger
    radius: 500                 # starting radius of the arena
    shapes: [square, circle]
    min-radius: 60
    shrink-start-seconds: 90
    shrink-duration-seconds: 60
    hold-seconds: 30
    shrink-factor: 0.7
    beacons: true
    beam-count: 24
    beam-block: RED_STAINED_GLASS
  schedule:
    enabled: true               # start a FFA automatically on a timer
    interval-seconds: 120       # every 2 minutes: queued players and everyone standing in the lobby area are teleported in
  lobby-radius: 10              # size of the lobby area around /ffartp lobby
  min-players: 2                # the countdown starts once this many are queued
  max-players: 20               # starts immediately when this many are queued (also limited by the arena's spawn blocks)
  start-delay-seconds: 20
  countdown-seconds: 5
  max-duration-seconds: 600     # 0 = no limit, a draw is declared when time runs out
  protect-radius: 40            # blocks around the spawn blocks that are protected during a FFA
  allow-building: false         # false = no placing/breaking and crystals do not destroy blocks

totemprac:
  help:                         # /totemprac help  and  /admintotemprac help
    player:
      - "<gold><bold>Totem practice"
      - "<yellow>/totemprac</yellow> <gray>- go to the practice world (run it again to leave)"
      - "<yellow>Button</yellow> <gray>- right click the button to start, right click again to stop. Only you are affected"
      - "<yellow>/totemprac spawn start</yellow> <gray>- spawns an aim target block in front of you, it grows when you aim at it"
      - "<yellow>/totemprac spawn stop</yellow> <gray>- removes the target"
    admin:
      - "<gold><bold>Totem practice setup (admin)"
      - "<yellow>1.</yellow> <white>/admintotemprac setting spawn</white> <gray>- stand where players should arrive and run it"
      - "<yellow>2.</yellow> <white>/admintotemprac create</white> <gray>- you get a <white>gold axe</white>: left click a block = corner 1, right click a block = corner 2 (the damage area)"
      - "<yellow>3.</yellow> <white>/admintotemprac button</white> <gray>- you get a <white>blaze rod</white>: right click the button players will press"
      - "<yellow>4.</yellow> <white>/admintotemprac setting <damage|hits|interval|gap|prepare> <value></white> <gray>- tune the practice"
      - "<yellow>5.</yellow> <white>/admintotemprac delete</white> <gray>- deletes the damage area"
  target:                       # /totemprac spawn start
    block: DIAMOND_BLOCK        # any block material
    size: 0.6                   # normal size in blocks
    grow-multiplier: 1.25       # size while you aim at it (1.25 = a little bigger)
    distance: 6.0               # how far in front of you it appears
    max-distance: 40.0          # how far away aiming still counts
    animation-ticks: 3          # growing/shrinking smoothness

discord:
  enabled: false                # needs a bot token (https://discord.com/developers/applications)
  token: ""
  guild-id: ""                  # your server ID, makes the slash commands appear immediately
  announce-channel-id: ""       # channel where tier promotions are announced
  code-length: 6
  code-expire-seconds: 300

results:                        # Discord tier results (needs the Discord bot, see discord:)
  normal-channel-id: ""         # channel for normal results (the embed, tiers up to LT3)
  high-channel-id: ""           # channel for high results (text, HT3 and up). Blank = announce-channel-id
  high-min-tier: HT3            # a result is "high" when the old or the new tier is at least this
  default-region: NA            # shown when a player has not set one with /region
  regions: [NA, EU, AS, AU, SA, AF, ME]
  auto-tester: "Auto Tester"    # shown as Tester for results from queue tier tests
  post-auto-promotions: true    # post queue tier test promotions
  post-auto-failures: true      # post queue tier tests that used up the last chance
  reactions: ["👑", "🥳", "😱", "😭", "😂", "💀"]   # the bot adds these to every result
  embed-color: "#FF0000"
  skin-url: "https://mc-heads.net/body/{name}/right"      # thumbnail of the normal result ({name}, {uuid})
  avatar-url: "https://mc-heads.net/avatar/{name}/64"     # small icon next to the title
  normal:
    author-title: "{player}'s Test Results 🏆"
    label-tester: "Tester:"
    label-region: "Region:"
    label-username: "Username:"
    label-previous: "Previous Rank:"
    label-earned: "Rank Earned:"
  high:
    header: "{mention} - **{player} - {headline}**"
    headline-passed: "Passed {tier}"
    headline-failed: "Failed {attempted}"
    fights-title: "__{tier} Fights:__"
    fight-line: "> {line}"
    outcome-promoted: "*Promoted To **{tier}***"
    outcome-demoted: "*Demoted To **{tier}***"
    outcome-failed: "*Stays **{tier}***"

placeholders:
  skin-url: "https://mc-heads.net/body/{name}/right"      # %vperplayerkit_top1_skin% (full body picture, {name} / {uuid})
  head-url: "https://mc-heads.net/avatar/{name}/128"      # %vperplayerkit_top1_head% (head picture)
  empty-skin-url: ""                                       # used when a top position is empty
  refresh-seconds: 60           # how often PlaceholderAPI values are refreshed from the database

report:
  reasons: [Cheating, Macro, AutoTotem, Hacks]   # choices in the /report dialog (players can also type their own)
  max-reason-length: 64
  cooldown-seconds: 60          # perplayerkit.report.bypass skips it
  notify-staff: true            # tell staff (perplayerkit.sus) about new reports

offend:
  reasons: [Cheating, Macro, AutoTotem, Hacks]
  allow-custom-reason: false    # true = /offend accepts any text as the reason
  ban-command: "ban {player} {reason}"     # run by the console. {player} {reason} {staff}. Use your punishment plugin's command here
  commands: {}                  # a different command per reason, e.g.  Macro: "tempban {player} 30d {reason}"
  broadcast: true

freeze:
  allow-chat: true              # frozen players can still talk to staff
  allowed-commands: [msg, r, reply, w, tell]
  logout-command: ""            # run when a frozen player disconnects, e.g. "ban {player} Left while frozen". Blank = nothing

ss:
  teleport-staff: true          # /ss also teleports you to the ss spawn (and back when it ends)

autocheck:
  max-pops: 10
  interval-ticks: 30            # pause between two pops
  max-wait-ticks: 60            # how long to wait for a new totem in hand
  suspicious-ticks: 4           # re-equipping a totem in this many ticks or fewer looks like AutoTotem (1 tick = 50 ms)
  suspicious-count: 1           # how many pops must look suspicious for the verdict

tpa:
  expire-seconds: 60
  delay-seconds: 3              # standing still time before the teleport (0 = instant)
  cancel-on-move: true
  cooldown-seconds: 5
  ignore-max-seconds: 604800    # longest /tpaignore time (7 days)

back:
  track-death: true             # /back also returns to where you died
  keep-after-logout: false

match-commands:
  # During a queue duel or a Gladiator fight only these commands work. The kit commands
  # (/kit, /k, /kit1-14, /lsk, /kitroom, /pk) are always disabled there.
  block-all-others: true       # false = only the kit commands are blocked, everything else still works
  allowed: [regear, leave, state]

gladiator:
  min-tier: LT2                 # lowest tier allowed to host (owners/YouTubers use perplayerkit.gladiator.bypass)
  join-requires-tier: false     # true = opponents need the tier as well
  use-host-kit: false           # false = the host picks a kit in the dialog, everyone else uses the kit they selected in the Kit Menu
                                # true  = everybody fights with the kit the host picked
  countdown-seconds: 5

tier:
  progress:                   # progress % a queue win gives towards the next tier test
    base: 15
    per-tier-difference: 3    # + for every tier the opponent is above you, - for every tier below
    per-opponent-totem-pop: 1
    opponent-totem-pop-max: 5
    per-own-totem-pop-penalty: 0.5
    per-kill: 1.5
    min-gain: 3
    max-gain: 40
    # fast wins add up to +5, very slow ones subtract 2 (built in)

